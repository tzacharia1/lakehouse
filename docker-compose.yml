services:
  postgres:
    image: postgres:16-alpine
    container_name: lakehouse-postgres
    environment:
      POSTGRES_USER: iceberg
      POSTGRES_PASSWORD: iceberg
      POSTGRES_DB: iceberg
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iceberg -d iceberg"]
      interval: 5s
      timeout: 5s
      retries: 20

  # S3-compatible warehouse. The minio/minio image is no longer published.
  seaweedfs:
    image: chrislusf/seaweedfs:4.53
    container_name: lakehouse-seaweedfs
    environment:
      AWS_ACCESS_KEY_ID: lakehouse
      AWS_SECRET_ACCESS_KEY: lakehouse12345
      S3_BUCKET: warehouse
    ports:
      - "8333:8333" # S3 API
      - "8888:8888" # filer UI
    volumes:
      - seaweed-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  trino:
    image: trinodb/trino:484
    container_name: lakehouse-trino
    ports:
      - "8080:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
      - ./sql:/sql:ro
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "trino", "--execute", "SELECT 1"]
      interval: 10s
      timeout: 15s
      retries: 18
      start_period: 20s

  seed:
    image: trinodb/trino:484
    container_name: lakehouse-seed
    depends_on:
      trino:
        condition: service_healthy
    volumes:
      - ./sql:/sql:ro
      - ./scripts/seed.sh:/seed.sh:ro
    entrypoint: ["bash", "/seed.sh"]

  web:
    build: ./web
    container_name: lakehouse-web
    ports:
      - "8000:8000"
    environment:
      TRINO_HOST: trino
      TRINO_PORT: "8080"
      TRINO_USER: trino
    depends_on:
      trino:
        condition: service_healthy

volumes:
  postgres-data:
  seaweed-data:
