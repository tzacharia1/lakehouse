<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lakehouse</title>
  <link rel="stylesheet" href="/static/app.css?v=7">
  <script type="importmap">
  {
    "imports": {
      "@duckdb/duckdb-wasm": "https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.32.0/dist/duckdb-browser.mjs",
      "apache-arrow": "https://cdn.jsdelivr.net/npm/apache-arrow@17.0.0/Arrow.dom.mjs",
      "flatbuffers": "https://cdn.jsdelivr.net/npm/flatbuffers@24.3.25/mjs/flatbuffers.js",
      "tslib": "https://cdn.jsdelivr.net/npm/tslib@2.8.1/tslib.es6.mjs"
    }
  }
  </script>
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">Trino · Iceberg</p>
      <h1>Lakehouse</h1>
    </div>
    <p class="hint">Preview shows 500 rows. CSV download includes up to 10,000.</p>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <label class="filter-label" for="filter">Tables</label>
      <input id="filter" type="search" placeholder="Filter by name" autocomplete="off">
      <div id="table-list" class="table-list" aria-live="polite">
        <p class="muted">Loading tables…</p>
      </div>
    </aside>

    <main>
      <form id="query-form">
        <label class="sql-label" for="sql">SQL</label>
        <div class="sql-editor">
          <pre id="sql-gutter" class="sql-gutter" aria-hidden="true">1</pre>
          <textarea id="sql" name="sql" spellcheck="false" wrap="off" rows="8">SELECT *
FROM iceberg.sales.customers</textarea>
        </div>
        <div class="actions">
          <button type="submit" id="run">Run</button>
          <button type="button" id="download" class="secondary">Download CSV</button>
          <p id="status" class="status"></p>
        </div>
      </form>

      <section id="lineage" class="lineage" hidden>
        <div class="lineage-heading">
          <h2 id="lineage-title">Lineage</h2>
          <p id="lineage-note" class="muted"></p>
        </div>
        <div id="lineage-track" class="lineage-track"></div>
      </section>

      <section id="analyze" class="analyze" hidden>
        <div class="analyze-heading">
          <h2>Report</h2>
          <p id="analyze-note" class="muted"></p>
        </div>
        <button type="button" id="analyze-more" class="secondary" hidden>Use up to 10,000 rows</button>
        <p class="zone-label">Columns</p>
        <div id="analyze-columns" class="column-tray"></div>
        <div class="zones">
          <div class="zone" data-zone="filters">
            <h3>Filters</h3>
            <div class="zone-chips"></div>
          </div>
          <div class="zone" data-zone="columns">
            <h3>Columns</h3>
            <div class="zone-chips"></div>
          </div>
          <div class="zone" data-zone="rows">
            <h3>Rows</h3>
            <div class="zone-chips"></div>
          </div>
          <div class="zone" data-zone="values">
            <h3>Values</h3>
            <div class="zone-chips"></div>
          </div>
        </div>
        <div id="analyze-filters" class="filter-list"></div>
        <p id="analyze-status" class="status"></p>
        <div id="analyze-error" class="message error" hidden></div>
        <details id="analyze-sql-wrap" hidden>
          <summary>DuckDB SQL</summary>
          <pre id="analyze-sql"></pre>
        </details>
        <div class="table-scroll">
          <table id="pivot">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section class="results">
        <div id="message" class="message" hidden></div>
        <div class="table-scroll">
          <table id="results">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="/static/app.js?v=6"></script>
  <script type="module">
    import("/static/pivot.js?v=6").catch(() => {
      const section = document.querySelector("#analyze");
      const note = document.querySelector("#analyze-note");
      if (!section || !note) return;
      section.hidden = false;
      note.textContent = "The report builder could not load. The SQL editor still works.";
    });
  </script>
</body>
</html>
