map $http_access_control_request_headers $cors_allow_headers {
    ""      "Content-Type, Authorization, X-Iceberg-Access-Delegation, X-Client-Info";
    default $http_access_control_request_headers;
}

server {
    listen 8181;
    server_name _;

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods "GET, HEAD, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers $cors_allow_headers always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            add_header Vary "Origin" always;
            return 204;
        }

        proxy_pass http://iceberg-rest:8181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;

        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Methods "GET, HEAD, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers $cors_allow_headers always;
        add_header Access-Control-Expose-Headers "ETag, Content-Type, Content-Length, Content-Range" always;
        add_header Vary "Origin" always;
    }
}
