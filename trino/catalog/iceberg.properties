connector.name=iceberg
iceberg.catalog.type=jdbc
iceberg.file-format=PARQUET

# Postgres stores Iceberg catalog rows (namespaces and table metadata pointers).
iceberg.jdbc-catalog.catalog-name=iceberg
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://postgres:5432/iceberg
iceberg.jdbc-catalog.connection-user=iceberg
iceberg.jdbc-catalog.connection-password=iceberg
iceberg.jdbc-catalog.default-warehouse-dir=s3://warehouse/
iceberg.jdbc-catalog.schema-version=V1

# SeaweedFS is the S3-compatible warehouse for Parquet data and Iceberg metadata files.
fs.native-s3.enabled=true
s3.endpoint=http://seaweedfs:8333
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=lakehouse
s3.aws-secret-key=lakehouse12345
